    <script>
            /**
             * ArchiveLayoutManager (Advanced Hub-and-Spoke Navigation & Responsive Console)
             * 支援完整 RWD 自適應控制列、水平專題平滑居中滑動、即時 Active Filter Chips、AND 全文檢索與防抖機制。
             * 嚴格遵守 Zero-Build 與原生封裝規範。
             */
            (function () {
                class ArchiveLayoutManager {
                    constructor() {
                        this.debug = false;
                        this.articles = [];
                        this.searchIndex = null;
                        this._loadingIndex = false;
                        this._debounceTimer = null;
                        this._pillsExpanded = false; // 賽道 pills 行動端展開狀態
                        this.state = {
                            category: 'all',
                            trackId: 'all',  // ★ P0 升級：主過濾軸，取代 series
                            tag: 'all',
                            search: '',
                            sort: 'published-desc'
                        };
                        this.selectors = {
                            seriesPills: '#series-pills-host',
                            categorySelect: '#categorySelect',
                            tagSelect: '#tagSelect',
                            searchInput: '#searchInput',
                            clearSearchBtn: '#clearSearchBtn',
                            sortSelect: '#sortSelect',
                            statsCount: '#stats-count',
                            activeChipsHost: '#active-chips-host',
                            resetBtn: '#resetAllBtn',
                            grid: '.archive-grid',
                            noResults: '#no-results',
                            resetNoResultsBtn: '#reset-no-results-btn'
                        };
                    }

                    init() {
                        this.articles = window.ArticleRepository ? window.ArticleRepository.all : [];
                        if (this.debug) console.log("ArchiveManager Init: Found articles:", this.articles.length);

                        if (window.HeaderComponent) new HeaderComponent().init();
                        if (window.FooterComponent) new FooterComponent().init();

                        this._parseUrlParams();
                        if (this.state.search) {
                            this._loadSearchIndex();
                        }
                        this.renderAll();
                        this._bindEvents();
                        this._bindHeaderSearchIntercept();
                        this._initScrollProgress();
                        this._initRelatedArticles();

                        if (window.ArticleRepository && typeof window.ArticleRepository.loadAllDetails === 'function') {
                            window.ArticleRepository.loadAllDetails().then((loadedArticles) => {
                                if (loadedArticles && Array.isArray(loadedArticles)) {
                                    this.articles = loadedArticles;
                                    this.renderAll();
                                }
                            }).catch(e => {
                                if (this.debug) console.warn("ArchiveManager: loadAllDetails failed:", e);
                            });
                        }

                        return this;
                    }

                    async _loadSearchIndex() {
                        if (this.searchIndex || this._loadingIndex) return;
                        this._loadingIndex = true;

                        const statusTip = document.querySelector('#search-status-tip');
                        if (statusTip) {
                            statusTip.textContent = '正在加載全文索引以進行深度模糊檢索...';
                            statusTip.classList.remove('hidden');
                        }

                        try {
                            const response = await fetch('../assets/js/search-index.json');
                            if (response.ok) {
                                this.searchIndex = await response.json();
                                if (this.debug) console.log("Search index loaded successfully:", this.searchIndex.length);
                                if (statusTip) {
                                    statusTip.textContent = '⚡ 已啟用全站全文模糊搜尋';
                                    setTimeout(() => {
                                        if (!this.state.search) {
                                            statusTip.classList.add('hidden');
                                        }
                                    }, 3000);
                                }
                                if (this.state.search) {
                                    this.renderAll();
                                }
                            } else {
                                throw new Error(`HTTP ${response.status}`);
                            }
                        } catch (e) {
                            console.error("Failed to load search index:", e);
                            if (statusTip) {
                                statusTip.textContent = '⚠️ 無法載入全文索引，已降級為基本檢索';
                                setTimeout(() => statusTip.classList.add('hidden'), 4000);
                            }
                        } finally {
                            this._loadingIndex = false;
                        }
                    }

                    _parseUrlParams() {
                        const params = new URLSearchParams(window.location.search);
                        if (params.get('filter')) this.state.category = params.get('filter');
                        else if (params.get('category')) this.state.category = params.get('category');

                        // ★ P0：新增 ?track= 參數支援（供 index.html 賽道卡片跳轉）
                        if (params.get('track')) this.state.trackId = params.get('track');
                        if (params.get('tag')) this.state.tag = params.get('tag');
                        if (params.get('q')) this.state.search = params.get('q');
                        if (params.get('sort')) this.state.sort = params.get('sort');

                        const inp = document.querySelector(this.selectors.searchInput);
                        if (inp && this.state.search) {
                            inp.value = this.state.search;
                            const clearBtn = document.querySelector(this.selectors.clearSearchBtn);
                            if (clearBtn) clearBtn.classList.remove('hidden');
                        }

                        const srt = document.querySelector(this.selectors.sortSelect);
                        if (srt && this.state.sort) srt.value = this.state.sort;
                    }

                    updateUrlAndRender() {
                        const params = new URLSearchParams();
                        if (this.state.category !== 'all') params.set('filter', this.state.category);
                        // ★ P0：trackId 取代 series 寫入 URL
                        if (this.state.trackId !== 'all') params.set('track', this.state.trackId);
                        if (this.state.tag !== 'all') params.set('tag', this.state.tag);
                        if (this.state.search) params.set('q', this.state.search);
                        if (this.state.sort !== 'published-desc') params.set('sort', this.state.sort);

                        const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
                        window.history.replaceState({ state: this.state }, '', newUrl);

                        this.renderAll();
                    }

                    renderAll() {
                        this._renderTrackPills();   // ★ P0：改為賽道 Pills
                        this._renderCategorySelect();
                        this._renderTagSelect();
                        this._renderActiveChips();
                        this._renderTrackBanner();  // ★ P0：賽道說明卡
                        this._filterAndRenderGrid();
                    }

                    // ── 1. ★ P0：12 大主題賽道選擇器 (Track Selector - Expandable Grid) ──
                    _renderTrackPills() {
                        const host = document.querySelector(this.selectors.seriesPills);
                        if (!host) return;

                        const allTracks = (window.TaxonomyConfig && typeof window.TaxonomyConfig.getAllTracks === 'function')
                            ? window.TaxonomyConfig.getAllTracks()
                            : {};

                        let html = `<div class="series-pill ${this.state.trackId === 'all' ? 'active' : ''}" data-value="all" style="--series-color: #ea580c">全部賽道</div>`;

                        Object.entries(allTracks).forEach(([id, info]) => {
                            const count = this._getTrackArticleCount(id);
                            html += `<div class="series-pill ${this.state.trackId === id ? 'active' : ''}" data-value="${id}" style="--series-color: ${info.hex}" title="${info.desc || info.name}">${info.name}<span style="margin-left:5px;opacity:0.65;font-size:10px;font-weight:600">${count}</span></div>`;
                        });

                        host.innerHTML = html;

                        // ── 行動端摺疊邏輯 ──
                        const origExpandBtn = document.querySelector('#track-expand-btn');
                        if (origExpandBtn) {
                            // Clone 移除舊事件監聽器
                            const expandBtn = origExpandBtn.cloneNode(true);
                            origExpandBtn.parentNode.replaceChild(expandBtn, origExpandBtn);

                            if (window.innerWidth < 640) {
                                // 行動端：啟用摺疊機制
                                if (this._pillsExpanded) {
                                    host.classList.add('pills-expanded');
                                    host.classList.remove('pills-collapsible');
                                } else {
                                    host.classList.add('pills-collapsible');
                                    host.classList.remove('pills-expanded');
                                }
                                expandBtn.classList.remove('hidden');

                                const syncLabel = () => {
                                    const lbl = document.querySelector('#track-expand-label');
                                    const ico = document.querySelector('#track-expand-icon');
                                    if (lbl) lbl.textContent = this._pillsExpanded ? '收合賽道' : '顯示全部 12 條賽道';
                                    if (ico) ico.style.transform = this._pillsExpanded ? 'rotate(180deg)' : '';
                                };
                                syncLabel();

                                expandBtn.addEventListener('click', () => {
                                    this._pillsExpanded = !this._pillsExpanded;
                                    host.classList.toggle('pills-collapsible', !this._pillsExpanded);
                                    host.classList.toggle('pills-expanded', this._pillsExpanded);
                                    syncLabel();
                                });
                            } else {
                                // 桌面端：全部展開，隱藏按鈕
                                host.classList.remove('pills-collapsible', 'pills-expanded');
                                expandBtn.classList.add('hidden');
                            }
                        }

                        // ── 賽道 pill 點擊 ──
                        host.querySelectorAll('.series-pill').forEach(el => {
                            el.addEventListener('click', () => {
                                this.state.trackId = el.dataset.value;
                                this.state.category = 'all';
                                this.state.tag = 'all';
                                this.updateUrlAndRender();
                            });
                        });
                    }

                    // ── 1b. ★ P0：賽道說明橫幅 (Track Banner) ──
                    _renderTrackBanner() {
                        const banner = document.querySelector('#track-banner');
                        if (!banner) return;

                        if (this.state.trackId === 'all') {
                            banner.style.display = 'none';
                            return;
                        }

                        const allTracks = window.TaxonomyConfig ? window.TaxonomyConfig.getAllTracks() : {};
                        const track = allTracks[this.state.trackId];
                        if (!track) { banner.style.display = 'none'; return; }

                        const count = this._getTrackArticleCount(this.state.trackId);
                        banner.style.display = 'block';
                        banner.innerHTML = `
                            <div style="border-left: 3px solid ${track.hex}; padding: 10px 16px; background: ${track.hex}18; border-radius: 0 10px 10px 0; margin-bottom: 16px;">
                                <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:${track.hex};margin-bottom:4px">主題賽道 · ${count} 篇</div>
                                <div style="font-size:15px;font-weight:700;color:inherit;margin-bottom:4px">${track.name}</div>
                                <div style="font-size:12px;opacity:.7;line-height:1.6">${track.desc || ''}</div>
                            </div>
                        `;
                    }

                    _getTrackArticleCount(trackId) {
                        return this.articles.filter(a => {
                            if (a.format === 'wiki') return false;
                            return a.trackId === trackId || this._matchTrackFallback(a, trackId);
                        }).length;
                    }

                    // ── Fallback Track Mapping ──
                    // 文章無 trackId 欄位時，透過 category + series + tags 推算所屬賽道
                    _matchTrackFallback(article, trackId) {
                        const RULES = {
                            'track-macro-credit':           { c: ['macro-geopolitics', 'traditional-markets', 'market-analysis'], s: [],                   t: ['macro-economy', 'liquidity-crisis', 'sec-inflation', 'fed'] },
                            'track-gold-supercycle':        { c: [],                                                              s: [],                   t: ['gold'] },
                            'track-ai-semiconductor':       { c: ['equity-research', 'tech-ai'],                                  s: [],                   t: ['compute-infra', 'amd', 'googl', 'orcl'] },
                            'track-mining-ai-capex':        { c: ['crypto-web3', 'tech-ai'],                                      s: [],                   t: ['depin'] },
                            'track-compute-agent-energy':   { c: ['tech-ai'],                                                     s: ['ai-economy'],       t: ['compute-infra', 'ai-agent'] },
                            'track-us-stocks-valuation':    { c: ['equity-research'],                                             s: [],                   t: ['us-stocks', 'valuation-risk', 'spacex', 'palantir', 'u', 'openai', 'googl', 'orcl', 'amd'] },
                            'track-btc-sovereign-liquidity':{ c: ['crypto-web3'],                                                 s: ['bitcoin'],          t: ['btc', 'mstr'] },
                            'track-web3-defai-regulation':  { c: ['crypto-web3'],                                                 s: ['tokenized-future'], t: ['crypto', 'rwa', 'eth', 'ethfi', 'eigenlayer', 'coinbase', 'ai-agent'] },
                            'track-jpy-carry-bonds':        { c: [],                                                              s: [],                   t: ['japan', 'us-treasury'] },
                            'track-energy-geopolitics':     { c: [],                                                              s: [],                   t: ['crude-oil', 'irgc'] },
                            'track-politics-tda-future':    { c: ['macro-geopolitics'],                                           s: [],                   t: ['us', 'china'] },
                            'track-methodology-research':   { c: ['research-tools'],                                              s: ['investment-sop'],   t: ['factor-investing', 'dcf-model', 'arbitrage', 'financial-analysis', 'chip-analysis'] }
                        };
                        const rule = RULES[trackId];
                        if (!rule) return false;
                        const artTags = Array.isArray(article.tags) ? article.tags : (article.tag ? [article.tag] : []);
                        // Series 為強信號：直接命中
                        if (rule.s.length > 0 && rule.s.includes(article.series)) return true;
                        // 僅 Tag 的賽道（c 為空）：Tag 命中即可
                        if (rule.c.length === 0) return rule.t.some(t => artTags.includes(t));
                        // Category + Tag 雙重驗證
                        const catMatch = rule.c.includes(article.category);
                        const tagMatch = rule.t.length === 0 || rule.t.some(t => artTags.includes(t));
                        return catMatch && tagMatch;
                    }

                    // ── 2. 文章大分類下拉 (Category Select) ──
                    _renderCategorySelect() {
                        const select = document.querySelector(this.selectors.categorySelect);
                        if (!select) return;

                        const categories = (window.TaxonomyConfig && typeof window.TaxonomyConfig.getAllCategories === 'function')
                            ? window.TaxonomyConfig.getAllCategories()
                            : {};

                        let html = `<option value="all" ${this.state.category === 'all' ? 'selected' : ''}>-- 全部文章分類 --</option>`;

                        Object.entries(categories).forEach(([id, info]) => {
                            html += `<option value="${id}" ${this.state.category === id ? 'selected' : ''}>${info.text}</option>`;
                        });

                        select.innerHTML = html;
                    }

                    // ── 3. 熱門研究主題標籤下拉 (Tag Select) ──
                    _renderTagSelect() {
                        const select = document.querySelector(this.selectors.tagSelect);
                        if (!select) return;

                        const tagCounts = {};
                        this.articles.forEach(a => {
                            if (a.format === 'wiki') return;

                            const matchCat = this.state.category === 'all' || a.category === this.state.category;
                            // ★ P0：改用 trackId 過濾 Tag 統計範圍
                            const matchTrack = this.state.trackId === 'all' || a.trackId === this.state.trackId;

                            if (matchCat && matchTrack) {
                                const tagsList = a.tags && Array.isArray(a.tags) ? a.tags : (a.tag ? [a.tag] : []);
                                tagsList.forEach(t => {
                                    tagCounts[t] = (tagCounts[t] || 0) + 1;
                                });
                            }
                        });

                        let html = `<option value="all" ${this.state.tag === 'all' ? 'selected' : ''}>-- 全部主題標籤 --</option>`;

                        Object.entries(tagCounts)
                            .sort((a, b) => b[1] - a[1])
                            .forEach(([tag, count]) => {
                                const tagInfo = window.TaxonomyConfig ? window.TaxonomyConfig.getTag(tag) : { text: tag };
                                html += `<option value="${tag}" ${this.state.tag === tag ? 'selected' : ''}>${tagInfo.text} (${count})</option>`;
                            });

                        select.innerHTML = html;
                    }

                    // ── 4. 已套用篩選標籤 (Active Filter Chips) ──
                    _renderActiveChips() {
                        const host = document.querySelector(this.selectors.activeChipsHost);
                        const resetBtn = document.querySelector(this.selectors.resetBtn);
                        if (!host) return;

                        const taxonomy = window.TaxonomyConfig;
                        const chips = [];

                        // ★ P0：trackId chip（主過濾軸）
                        if (this.state.trackId !== 'all') {
                            const allTracks = taxonomy ? taxonomy.getAllTracks() : {};
                            const trackInfo = allTracks[this.state.trackId];
                            chips.push({
                                type: 'trackId',
                                label: `賽道: ${trackInfo ? trackInfo.name : this.state.trackId}`
                            });
                        }

                        if (this.state.category !== 'all') {
                            const catInfo = taxonomy ? taxonomy.getCategory(this.state.category) : { text: this.state.category };
                            chips.push({
                                type: 'category',
                                label: `分類: ${catInfo ? catInfo.text : this.state.category}`
                            });
                        }

                        if (this.state.tag !== 'all') {
                            const tagInfo = taxonomy ? taxonomy.getTag(this.state.tag) : { text: this.state.tag };
                            chips.push({
                                type: 'tag',
                                label: `標籤: ${tagInfo ? tagInfo.text : this.state.tag}`
                            });
                        }

                        if (this.state.search) {
                            chips.push({
                                type: 'search',
                                label: `搜尋: "${this.state.search}"`
                            });
                        }

                        if (chips.length === 0) {
                            host.innerHTML = `<span class="text-slate-400 dark:text-slate-500">當前顯示：全部已收錄研究文章</span>`;
                            if (resetBtn) resetBtn.classList.add('hidden');
                        } else {
                            host.innerHTML = chips.map(c => `
                            <span class="active-filter-chip">
                                <span>${this._escapeHtml(c.label)}</span>
                                <button type="button" data-chip-type="${c.type}" title="移除此篩選條件" aria-label="移除 ${this._escapeHtml(c.label)}">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
                                </button>
                            </span>
                        `).join('');
                            if (resetBtn) resetBtn.classList.remove('hidden');

                            host.querySelectorAll('button[data-chip-type]').forEach(btn => {
                                btn.addEventListener('click', (e) => {
                                    const type = btn.dataset.chipType;
                                    // ★ P0
                                    if (type === 'trackId') this.state.trackId = 'all';
                                    else if (type === 'category') this.state.category = 'all';
                                    else if (type === 'tag') this.state.tag = 'all';
                                    else if (type === 'search') {
                                        this.state.search = '';
                                        const inp = document.querySelector(this.selectors.searchInput);
                                        if (inp) inp.value = '';
                                        const clearBtn = document.querySelector(this.selectors.clearSearchBtn);
                                        if (clearBtn) clearBtn.classList.add('hidden');
                                    }
                                    this.updateUrlAndRender();
                                });
                            });
                        }
                    }

                    // ── 5. 滿版網格過濾與排序渲染 ──
                    _filterAndRenderGrid() {
                        const { category, series, tag, search, sort } = this.state;

                        let matchedMap = new Map();
                        let hasSearch = false;

                        if (search) {
                            hasSearch = true;
                            const queryLower = search.toLowerCase();
                            const tokens = queryLower.split(/\s+/).filter(t => t);

                            if (tokens.length > 0) {
                                if (this.searchIndex && Array.isArray(this.searchIndex)) {
                                    this.searchIndex.forEach(item => {
                                        const textToSearch = (item.title + ' ' + item.desc + ' ' + (item.content || '')).toLowerCase();
                                        const matchAll = tokens.every(t => textToSearch.includes(t));

                                        if (matchAll) {
                                            let score = 0;
                                            tokens.forEach(t => {
                                                if (item.title.toLowerCase().includes(t)) {
                                                    score += 100;
                                                    if (item.title.toLowerCase() === t) score += 300;
                                                }
                                                if (item.desc && item.desc.toLowerCase().includes(t)) {
                                                    score += 40;
                                                }
                                                if (item.content) {
                                                    const contentLower = item.content.toLowerCase();
                                                    let count = 0;
                                                    let pos = contentLower.indexOf(t);
                                                    while (pos !== -1) {
                                                        count++;
                                                        pos = contentLower.indexOf(t, pos + t.length);
                                                        if (count >= 20) break;
                                                    }
                                                    score += count * 5;
                                                }
                                            });
                                            matchedMap.set(item.id, score);
                                        }
                                    });
                                } else {
                                    this.articles.forEach(a => {
                                        const textToSearch = (a.title + ' ' + a.desc + ' ' + (a.keywords || '')).toLowerCase();
                                        const matchAll = tokens.every(t => textToSearch.includes(t));
                                        if (matchAll) {
                                            matchedMap.set(a.id, 1);
                                        }
                                    });
                                    this._loadSearchIndex();
                                }
                            }
                        }

                        const { trackId } = this.state; // ★ P0
                        let filtered = this.articles.filter(a => {
                            const matchCat = category === 'all' ? a.format !== 'wiki' : a.category === category;
                            // ★ P0：trackId 為主過濾軸（含 Fallback 映射）
                            const matchTrack = trackId === 'all' || a.trackId === trackId || this._matchTrackFallback(a, trackId);
                            const matchTag = tag === 'all' || (a.tags && a.tags.includes(tag)) || a.tag === tag;
                            const matchSearch = !hasSearch || matchedMap.has(a.id);
                            return matchCat && matchTrack && matchTag && matchSearch;
                        });

                        const [key, order] = sort.split('-');
                        filtered.sort((a, b) => {
                            if (hasSearch && sort === 'published-desc') {
                                const scoreA = matchedMap.get(a.id) || 0;
                                const scoreB = matchedMap.get(b.id) || 0;
                                if (scoreB !== scoreA) {
                                    return scoreB - scoreA;
                                }
                            }
                            const valA = new Date(a[key]);
                            const valB = new Date(b[key]);
                            return order === 'desc' ? valB - valA : valA - valB;
                        });

                        const statsCount = document.querySelector(this.selectors.statsCount);
                        if (statsCount) statsCount.textContent = filtered.length;

                        this._renderGrid(filtered);
                    }

                    _renderGrid(articles) {
                        const grid = document.querySelector(this.selectors.grid);
                        const noResults = document.querySelector(this.selectors.noResults);
                        if (!grid) return;

                        grid.innerHTML = articles.map(a => this._createCardHtml(a)).join('');
                        if (noResults) noResults.style.display = articles.length === 0 ? 'block' : 'none';
                    }

                    _escapeHtml(str) {
                        if (!str) return '';
                        return String(str)
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;')
                            .replace(/"/g, '&quot;')
                            .replace(/'/g, '&#039;');
                    }

                    _highlightText(text, search) {
                        if (!text) return '';
                        const escaped = this._escapeHtml(text);
                        if (!search || !search.trim()) return escaped;

                        const tokens = search.trim().split(/\s+/).filter(t => t);
                        if (tokens.length === 0) return escaped;

                        const regexTokens = tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                        const regex = new RegExp(`(${regexTokens.join('|')})`, 'gi');

                        return escaped.replace(regex, '<mark class="bg-amber-200/90 dark:bg-amber-500/30 text-amber-950 dark:text-amber-200 px-1 py-0.5 rounded font-semibold">$1</mark>');
                    }

                    _createCardHtml(article) {
                        const taxonomy = window.TaxonomyConfig;
                        const tagsList = article.tags && Array.isArray(article.tags) ? article.tags : (article.tag ? [article.tag] : []);
                        const tagsHtml = tagsList.slice(0, 2).map(t => {
                            const tagInfo = taxonomy ? taxonomy.getTag(t) : { text: t, color: 'text-slate-600 dark:text-slate-300' };
                            return `<span class="text-[10px] sm:text-[11px] font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800/90 uppercase tracking-wider px-2 sm:px-2.5 py-0.5 border border-slate-200 dark:border-slate-700 rounded-full">${tagInfo.text}</span>`;
                        }).join('');

                        const seriesInfo = article.series && taxonomy ? taxonomy.getSeries(article.series) : null;
                        const isActiveSeries = this.state.series === article.series;

                        const isModified = article.modified && article.modified !== article.published;
                        const dateHtml = isModified
                            ? `<span class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-400 font-mono tracking-tight" title="發布於 ${article.published}">UPDATED / ${article.modified}</span>`
                            : `<span class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-400 font-mono tracking-tight">PUBLISHED / ${article.published}</span>`;

                        const titleHtml = this._highlightText(article.title, this.state.search);
                        const descHtml = this._highlightText(article.desc || '', this.state.search);

                        return `
                        <div class="article-card flex flex-col rounded-2xl sm:rounded-3xl shadow-sm hover:shadow-xl ${isActiveSeries ? 'border-orange-500/80 shadow-orange-500/10' : ''} overflow-hidden transition-all duration-200 hover:-translate-y-1 active:scale-[0.99] group h-full">
                            <a href="../${article.link}" class="flex flex-col flex-1 p-4.5 sm:p-6 md:p-7">
                                <div class="flex items-center justify-between gap-2 mb-3 sm:mb-4 flex-wrap">
                                    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                                        ${seriesInfo ? `
                                            <div class="flex items-center px-2 sm:px-2.5 py-0.5 rounded-full ${isActiveSeries ? 'bg-orange-500/15 text-orange-600 dark:text-orange-400 border border-orange-500/40' : 'bg-slate-100 dark:bg-slate-800/90 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'} transition-colors">
                                                <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider">${seriesInfo.text}</span>
                                            </div>
                                        ` : ''}
                                        ${tagsHtml}
                                    </div>
                                    <div class="ml-auto shrink-0">
                                        ${dateHtml}
                                    </div>
                                </div>
                                <h2 class="text-base sm:text-lg md:text-xl font-bold text-slate-900 dark:text-slate-100 group-hover:text-orange-600 dark:group-hover:text-orange-400 transition-colors font-noto leading-snug mb-2 sm:mb-3">
                                    ${titleHtml}
                                </h2>
                                <p class="text-slate-600 dark:text-slate-300 text-xs sm:text-sm leading-relaxed line-clamp-3 mb-4 sm:mb-6">
                                    ${descHtml}
                                </p>
                                <div class="mt-auto pt-4 border-t border-slate-100 dark:border-slate-700/80 flex items-center justify-between gap-3">
                                    <div class="flex flex-wrap gap-1 sm:gap-1.5 min-w-0">
                                        ${article.keywords ? article.keywords.split(',').slice(0, 3).map(k => `<span class="text-[10px] sm:text-[11px] text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800/90 px-2 py-0.5 rounded-md border border-slate-200 dark:border-slate-700 font-medium truncate max-w-[100px]">#${k.trim()}</span>`).join('') : ''}
                                    </div>
                                    <span class="text-orange-600 dark:text-orange-400 text-[11px] sm:text-xs font-bold uppercase tracking-wider group-hover:translate-x-0.5 transition-transform flex items-center gap-1 whitespace-nowrap shrink-0 ml-auto">
                                        閱讀分析 →
                                    </span>
                                </div>
                            </a>
                        </div>
                    `;
                    }

                    // ── 事件綁定與重置邏輯 ──
                    _bindEvents() {
                        const pageSearch = document.querySelector(this.selectors.searchInput);
                        const clearBtn = document.querySelector(this.selectors.clearSearchBtn);

                        if (pageSearch) {
                            pageSearch.addEventListener('focus', () => this._loadSearchIndex());
                            pageSearch.addEventListener('mouseenter', () => this._loadSearchIndex());
                        }

                        if (clearBtn) {
                            clearBtn.addEventListener('click', () => {
                                this.state.search = '';
                                if (pageSearch) pageSearch.value = '';
                                clearBtn.classList.add('hidden');
                                this.updateUrlAndRender();
                            });
                        }

                        document.addEventListener('input', (e) => {
                            if (e.target.id === 'searchInput') {
                                const val = e.target.value.trim();
                                if (clearBtn) {
                                    if (val) clearBtn.classList.remove('hidden');
                                    else clearBtn.classList.add('hidden');
                                }

                                // 防抖 Debounce 150ms
                                clearTimeout(this._debounceTimer);
                                this._debounceTimer = setTimeout(() => {
                                    this.state.search = val;
                                    const headerHost = document.querySelector('#header-host');
                                    if (headerHost && headerHost.shadowRoot) {
                                        headerHost.shadowRoot.querySelectorAll('.header-search-input, .mobile-search-input').forEach(inp => inp.value = this.state.search);
                                    }
                                    this._loadSearchIndex();
                                    this.updateUrlAndRender();
                                }, 150);
                            }
                        });

                        document.addEventListener('change', (e) => {
                            if (e.target.id === 'sortSelect') {
                                this.state.sort = e.target.value;
                                this.updateUrlAndRender();
                            } else if (e.target.id === 'categorySelect') {
                                this.state.category = e.target.value;
                                this.updateUrlAndRender();
                            } else if (e.target.id === 'tagSelect') {
                                this.state.tag = e.target.value;
                                this.updateUrlAndRender();
                            }
                        });

                        const resetBtn = document.querySelector(this.selectors.resetBtn);
                        if (resetBtn) resetBtn.addEventListener('click', () => this.resetAllFilters());

                        const resetNoRes = document.querySelector(this.selectors.resetNoResultsBtn);
                        if (resetNoRes) resetNoRes.addEventListener('click', () => this.resetAllFilters());

                        window.addEventListener('popstate', (e) => {
                            if (e.state && e.state.state) {
                                this.state = e.state.state;
                            } else {
                                this._parseUrlParams();
                            }
                            const pageSearch = document.querySelector(this.selectors.searchInput);
                            if (pageSearch) {
                                pageSearch.value = this.state.search;
                                if (clearBtn) {
                                    if (this.state.search) clearBtn.classList.remove('hidden');
                                    else clearBtn.classList.add('hidden');
                                }
                            }
                            this.renderAll();
                        });
                    }

                    resetAllFilters() {
                        this.state.category = 'all';
                        this.state.trackId = 'all'; // ★ P0
                        this.state.tag = 'all';
                        this.state.search = '';
                        this.state.sort = 'published-desc';

                        const pageSearch = document.querySelector(this.selectors.searchInput);
                        if (pageSearch) pageSearch.value = '';

                        const clearBtn = document.querySelector(this.selectors.clearSearchBtn);
                        if (clearBtn) clearBtn.classList.add('hidden');

                        const headerHost = document.querySelector('#header-host');
                        if (headerHost && headerHost.shadowRoot) {
                            headerHost.shadowRoot.querySelectorAll('.header-search-input, .mobile-search-input').forEach(inp => inp.value = '');
                        }

                        const statusTip = document.querySelector('#search-status-tip');
                        if (statusTip) statusTip.classList.add('hidden');

                        this.updateUrlAndRender();
                    }

                    _bindHeaderSearchIntercept() {
                        const checkHeader = setInterval(() => {
                            const headerHost = document.querySelector('#header-host');
                            if (headerHost && headerHost.shadowRoot) {
                                const searchInputs = headerHost.shadowRoot.querySelectorAll('.header-search-input, .mobile-search-input');
                                if (searchInputs.length > 0) {
                                    clearInterval(checkHeader);
                                    searchInputs.forEach(input => {
                                        if (this.state.search) input.value = this.state.search;

                                        input.addEventListener('focus', () => this._loadSearchIndex());
                                        input.addEventListener('mouseenter', () => this._loadSearchIndex());

                                        input.addEventListener('input', (e) => {
                                            this.state.search = e.target.value.trim();
                                            const pageSearch = document.querySelector(this.selectors.searchInput);
                                            if (pageSearch) pageSearch.value = this.state.search;
                                            this._loadSearchIndex();
                                            this.updateUrlAndRender();
                                        });

                                        input.addEventListener('keydown', (e) => {
                                            if (e.key === 'Enter') {
                                                e.preventDefault();
                                                e.stopPropagation();
                                            }
                                        });
                                    });
                                }
                            }
                        }, 100);

                        setTimeout(() => clearInterval(checkHeader), 10000);
                    }

                    _initScrollProgress() {
                        const progressBar = document.getElementById('scroll-progress-bar');
                        window.addEventListener('scroll', () => {
                            const winScroll = document.documentElement.scrollTop;
                            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                            const scrolled = (winScroll / height) * 100;
                            if (progressBar) progressBar.style.width = scrolled + '%';
                        }, { passive: true });
                    }

                    _initRelatedArticles() {
                        if (window.RelatedArticlesComponent) {
                            new RelatedArticlesComponent()
                                .setContainerId('related-articles-container')
                                .setLimit(3)
                                .init();
                        }
                    }
                }

                document.addEventListener('DOMContentLoaded', () => {
                    window.ArchiveManager = new ArchiveLayoutManager().init();
                });
            })();
    </script>
    <script src="../assets/js/widget-related-articles.js"></script>
</body>
