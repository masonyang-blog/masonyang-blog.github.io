    <!-- Smart Redirect Router -->
    <script>
        (function() {
            // 完整歷史路徑對照字典 (Relative or Absolute)
            const EXACT_MAP = {
                // 1. 知識庫與工具重構
                'post/topic-knowledge.html': 'apps/topic-knowledge/topic-knowledge.html',
                'post/crypto-knowledge.html': 'apps/topic-knowledge/topic-knowledge.html',
                'tools/ai-miners-sheet/ai-miners-core-metrics-benchmark.html': 'apps/ai-miners-sheet/ai-miners-core-metrics-benchmark.html',

                // 2. news- 前綴歷史文章 (2026/03 系列)
                'news/news-20260326-investment-research-guide.html': 'news/20260326-investment-research-guide.html',
                'news/news-20260320-us-computing-infrastructure.html': 'news/20260320-us-computing-infrastructure.html',
                'news/news-20260323-gold-crash-analysis.html': 'news/20260323-gold-crash-analysis.html',
                'news/news-20260317-eth-surge-analysis.html': 'news/20260317-eth-surge-analysis.html',
                'news/news-20260323-palantir-iran-war-commodities.html': 'news/20260323-palantir-iran-war-commodities.html',
                'news/news-20260325-us-private-credit-crisis.html': 'news/20260325-us-private-credit-crisis.html',
                'news/news-20260313-bitwise-1m.html': 'news/20260313-bitwise-1m.html',
                'news/news-20260325-private-credit-gold-crisis.html': 'news/20260325-private-credit-gold-crisis.html',
                'news/news-20260327-invest-research-handbook.html': 'news/20260327-invest-research-handbook.html',
                'news/news-20260319-gold-crash-analysis.html': 'news/20260319-gold-crash-analysis.html',

                // 3. 比特幣專欄重構
                'post/topic-btc-02-price-factors.html': 'post/crypto-btc-02-price-factors.html',
                'post/topic-btc-sovereign-liquidity.html': 'post/crypto-btc-04-sovereign-liquidity.html',
                'post/btcoin-valuation-models.html': 'post/crypto-btc-01-valuation-models.html',

                // 4. 交易策略與期權重構
                'post/dcf-valuation-model.html': 'post/trading-strategies-dcf-valuation-model.html',
                'post/dcf-valuation-model-guide.html': 'post/trading-strategies-dcf-valuation-model-guide.html',
                'post/trading-strategies--commodity-futures.html': 'post/trading-strategies-commodity-futures.html',
                'news/20260520-options-strategy-deep-research.html': 'post/trading-strategies-options-yield-enhancement-strategies.html',
                'news/20260520-options-strategy-deep-research-part2.html': 'post/trading-strategies-options-volatility-strategies.html',

                // 5. 日期連字號修正
                'news/2026-07-02-oil-market-deep-dive.html': 'news/20260702-oil-market-deep-dive.html'
            };

            const pathname = window.location.pathname;
            // 去除最前方的斜線
            let normalized = pathname.replace(/^\/+/, '');

            let target = EXACT_MAP[normalized];

            // 若無精確匹配，嘗試智慧啟發式推導 (Heuristic fallback)
            if (!target) {
                // 規則 A: news/news-YYYYMMDD-... 轉為 news/YYYYMMDD-...
                if (normalized.startsWith('news/news-')) {
                    target = normalized.replace('news/news-', 'news/');
                }
                // 規則 B: post/trading-strategies--... 雙減號轉單減號
                else if (normalized.includes('--')) {
                    target = normalized.replace(/--+/g, '-');
                }
                // 規則 C: tools/ai-miners-sheet/... 轉為 apps/ai-miners-sheet/...
                else if (normalized.startsWith('tools/ai-miners-sheet/')) {
                    target = normalized.replace('tools/ai-miners-sheet/', 'apps/ai-miners-sheet/');
                }
            }

            if (target) {
                // 命中重定向
                const origin = window.location.origin;
                const fullTargetUrl = `${origin}/${target}`;

                const redirectPanel = document.getElementById('redirect-panel');
                const notFoundPanel = document.getElementById('not-found-panel');
                const targetDisplay = document.getElementById('target-url-display');
                const immediateBtn = document.getElementById('immediate-redirect-btn');
                const cancelBtn = document.getElementById('cancel-redirect-btn');
                const progressBar = document.getElementById('progress-bar');

                if (redirectPanel && notFoundPanel) {
                    notFoundPanel.classList.add('hidden');
                    redirectPanel.classList.remove('hidden');
                    targetDisplay.textContent = fullTargetUrl;
                    immediateBtn.href = fullTargetUrl;

                    // 啟動進度條
                    requestAnimationFrame(() => {
                        progressBar.style.width = '100%';
                    });

                    // 1.2 秒後自動跳轉
                    const timer = setTimeout(() => {
                        window.location.replace(fullTargetUrl);
                    }, 1200);

                    cancelBtn.addEventListener('click', () => {
                        clearTimeout(timer);
                        redirectPanel.classList.add('hidden');
                        notFoundPanel.classList.remove('hidden');
                    });
                }
            }
        })();
    </script>
